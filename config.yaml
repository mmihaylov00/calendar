name: Calendar
version: "0.6.1-ha.6"
slug: marco
description: Calendar dashboard using Home Assistant calendars and login.
url: https://github.com/mmihaylov00/calendar
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 3000
ingress_entry: admin/
ingress_stream: true
panel_title: Calendar
panel_icon: mdi:calendar-month
panel_admin: true
homeassistant_api: true
backup: cold
environment:
  MARCO_HOME_ASSISTANT: "1"
  MARCO_UPDATE_CHECK: "0"
options: {}
schema: {}
