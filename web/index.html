<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Calendar</title>
    <!-- Inter, Outfit and the "Marco Emoji" subset are bundled. Self-hosted servers also load Noto Color Emoji from
         Google Fonts from the page script (web/display/health.ts), so this page has no inline script. -->
  </head>
  <body>
    <div id="app" class="preset-bigCalendar side-left booting">
      <div class="photo-area"><div class="ph-stack"></div><div class="scrim"></div></div>
      <section class="side">
        <div class="side-top">
          <div id="clock"></div>
          <div id="highlights"></div>
        </div>
        <div class="side-mid">
          <div id="side-agenda"></div>
        </div>
        <div class="side-bottom"><div id="weather"></div></div>
        <div class="photo-meta" style="display: none"></div>
      </section>
      <section class="main">
        <nav id="day-nav" class="day-nav" aria-label="Day view" hidden>
          <button id="day-back" type="button"><span aria-hidden="true">←</span> Back to calendar</button>
        </nav>
        <div id="calendar"></div>
        <div id="agenda"></div>
        <div id="view"></div>
      </section>
    </div>
    <div id="screen-note" aria-hidden="true"></div>
    <div id="status" aria-hidden="true"></div>
    <p id="access-note" role="alert" hidden></p>
    <script type="module" src="/display/main.ts"></script>
  </body>
</html>
